
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Room Service · Encima Roofdeck Bar &amp; Restaurant</title>
  <meta name="description" content="Room Service menu, City Garden Hotel Makati.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#44596b">

  <link rel="icon" href="../images/logo.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;600&family=Noto+Sans+KR:wght@400;600&family=Noto+Sans+SC:wght@400;600&family=Noto+Sans+TC:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="page-rs">

  <!-- HEADER -->
  <header class="top">
    <div class="top-inner">

      <a class="brand notranslate" translate="no" href="../" aria-label="Encima Roofdeck">
        <img src="../images/logo.webp" alt="" width="46" height="40">
        <span>
          <b>ENCIMA ROOFDECK</b>
          <small>Bar &amp; Restaurant</small>
        </span>
      </a>

      <div class="top-tools">
        <label class="visually-hidden" for="lang">Language</label>
        <select id="lang" aria-label="Language" translate="no" class="notranslate"></select>
      </div>

    </div>
  </header>



  <!-- INTRO (anchor used by the scroll helpers in app.js) -->
  <section class="block menu-intro" id="menu">
    <div class="wrap">
      <p class="kick center notranslate" translate="no">City Garden Hotel Makati</p>
      <h1 class="title center notranslate" translate="no">Room Service</h1>
    </div>
  </section>


  <!-- MENU NAVIGATION -->
  <nav class="nav" aria-label="Menu navigation">

    <div class="nav-inner">

      <div class="groups" id="groups" role="tablist"></div>

      <!-- Phones: compact icon buttons. Hidden on larger screens. -->
      <button type="button" class="icon-btn" id="searchToggle"
              aria-label="Search the menu" aria-expanded="false" aria-controls="searchWrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path>
        </svg>
      </button>

      <button type="button" class="icon-btn" id="optionsBtn"
              aria-label="Sort and filter" aria-expanded="false" aria-controls="tools">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path>
          <circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle>
        </svg>
        <span class="opt-badge" id="optBadge" hidden></span>
      </button>

      <div class="search" id="searchWrap">
        <input
          id="q"
          type="search"
          autocomplete="off"
          placeholder="Search the menu…"
          aria-label="Search the menu"
        >
      </div>

    </div>

    <!-- Desktop: inline row. Phones: slide-up sheet opened by the sort/filter button. -->
    <div class="tools" id="tools">

      <div class="sheet-head">
        <b data-i18n="optTitle">Sort &amp; filter</b>
        <button type="button" class="x" id="toolsClose" aria-label="Close">×</button>
      </div>

      <label class="tool">
        <span data-i18n="sectionLbl">Section</span>
        <select id="sectionSel"></select>
      </label>

      <div class="tool filter-wrap">

        <span data-i18n="filters">Filters</span>

        <button
          id="filterBtn"
          class="fbtn"
          aria-expanded="false"
          aria-controls="filterPanel"
        ></button>

        <div id="filterPanel" class="fpanel" hidden>

          <div class="fpanel-head">
            <b data-i18n="filters">Filters</b>
            <button class="x" id="fClose" aria-label="Close">×</button>
          </div>

          <div id="filterList"></div>

          <div class="fpanel-foot">
            <button class="link" id="fClear" data-i18n="clear">Clear</button>
            <button class="btn small" id="fDone" data-i18n="done">Done</button>
          </div>

        </div>

      </div>

      <label class="tool">
        <span data-i18n="sortLbl">Sort by</span>
        <select id="sortSel"></select>
      </label>

      <div class="sheet-foot">
        <button type="button" class="link" id="toolsClear" data-i18n="clear">Clear</button>
        <button type="button" class="btn small" id="toolsDone" data-i18n="showResults">Show results</button>
      </div>

    </div>

    <div class="active" id="active"></div>

  </nav>

  <div class="scrim" id="scrim" hidden></div>


  <!-- MENU ITEMS -->
  <main id="menuList" class="menu"></main>


  <!-- FOOTER -->
  <footer class="foot" id="contact">
    <img src="../images/logo.webp" alt="Encima Roofdeck" width="64">
    <p class="vat" data-i18n="vat">All prices inclusive of VAT. No service charge.</p>
  </footer>


  <!-- MENU ITEM MODAL -->
  <div
    id="modal"
    class="modal"
    hidden
    role="dialog"
    aria-modal="true"
    aria-labelledby="mTitle"
  >

    <div class="modal-card">

      <button class="modal-close" id="mClose" aria-label="Close">×</button>

      <div class="carousel" id="carousel"></div>

      <div class="modal-body" id="mBody"></div>

    </div>

  </div>
  <div id="google_translate_element" style="display:none"></div>
  <script>
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'tl,zh-CN,zh-TW,ko,ja,es,fr,de,ru,ar,hi,th,vi,id',
      autoDisplay: false
    }, 'google_translate_element');
  }
  </script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <style>
    .skiptranslate iframe, .goog-te-banner-frame { display: none !important; }
    body { top: 0 !important; }
  </style>

  <div id="google_translate_element" style="display:none"></div>
  <script>
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'tl,zh-CN,zh-TW,ko,ja,es,fr,de,ru,ar,hi,th,vi,id',
      autoDisplay: false
    }, 'google_translate_element');
  }
  </script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <style>
    .skiptranslate iframe, .goog-te-banner-frame { display: none !important; }
    body { top: 0 !important; }
  </style>

  <!-- Tells app.js this is the Room Service page and that assets live one folder up -->
  <script>window.ENCIMA_PAGE = "room-service"; window.ENCIMA_ROOT = "../";</script>

  <!-- SCRIPTS: KEEP THIS ORDER -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>

</body>
</html>
