<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Encima desk</title>
<link rel="icon" href="../images/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="desk.css">
</head>
<body>
<div id="gate" class="gate">
  <div class="card">
    <img src="../images/logo.webp" alt="" width="56">
    <h1>Encima desk</h1>
    <p class="muted" id="gateNote">Staff only. Guest menu is on the public site.</p>
    <form id="loginForm" hidden>
      <label>Work email<input type="email" name="email" required autocomplete="username"></label>
      <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit">Sign in</button>
      <p class="err" id="loginErr" hidden></p>
    </form>
    <div id="setup" hidden>
      <p>Paste your Supabase URL and anon key into <code>js/config.js</code>, then run <code>supabase/schema.sql</code> and <code>supabase/seed.sql</code> in the SQL editor. Invite the staff emails under Authentication → Users.</p>
    </div>
  </div>
</div>

<div id="desk" hidden>
  <header class="bar">
    <div class="brand"><img src="../images/logo.webp" alt="" width="36"><strong>Encima desk</strong></div>
    <nav>
      <button data-view="items" class="on">Menu</button>
      <button data-view="review">Review <span class="count" id="revCount" hidden></span></button>
      <button data-view="pages">Pages</button>
    </nav>
    <div class="who"><span id="who"></span><button class="link" id="out">Sign out</button></div>
  </header>
  <main id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/data.js"></script>
<script src="desk.js"></script>
</body>
</html>
